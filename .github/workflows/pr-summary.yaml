name: AI PR summary

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  summarize:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    env:
      OPENAI_MODEL: gpt-5-mini
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Fetch PR diff
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3.diff" \
            "${PR_URL}" > pr.diff
          head -c 60000 pr.diff > pr-truncated.diff

      - name: Generate summary
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          jq -n \
            --arg model "${OPENAI_MODEL}" \
            --arg title "${PR_TITLE}" \
            --arg base "${PR_BASE}" \
            --arg head "${PR_HEAD}" \
            --rawfile diff pr-truncated.diff \
            '{
              model: $model,
              input: [
                {
                  role: "system",
                  content: "You summarize pull requests for maintainers. Be concise, concrete, and cautious. Use only the supplied title, branch names, and diff. Do not invent test results or reviewer findings."
                },
                {
                  role: "user",
                  content: (
                    "Summarize this pull request for a Puppet module maintainer.\n\n" +
                    "Title: " + $title + "\n" +
                    "Base branch: " + $base + "\n" +
                    "Head branch: " + $head + "\n\n" +
                    "Write Markdown with these sections:\n" +
                    "- Summary: 2-4 bullets describing the change.\n" +
                    "- Maintainer Notes: mention likely risk areas, generated files, CI/test implications, or dependency changes when visible.\n" +
                    "- Suggested Checks: list commands or checks that appear relevant; say when this cannot be inferred.\n\n" +
                    "Diff, possibly truncated to the first 60000 bytes:\n" + $diff
                  )
                }
              ],
              max_output_tokens: 900
            }' > request.json

          curl -fsS https://api.openai.com/v1/responses \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json > response.json

          jq -r ".output_text" response.json > summary.md

      - name: Post summary comment
        if: ${{ env.OPENAI_API_KEY != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- ai-pr-summary -->";
            const summary = fs.readFileSync("summary.md", "utf8").trim();
            const body = `${marker}
            ## AI PR Summary

            ${summary}

            _Generated from the PR diff. Treat as advisory, not as a substitute for review or CI._`;

            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const previous = comments.data.find((comment) =>
              comment.user.type === "Bot" && comment.body.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
