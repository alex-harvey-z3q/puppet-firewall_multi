name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - ruby: "2.7"
            puppet: "~> 7.0"
          - ruby: "3.2"
            puppet: "~> 8.0"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        name: Set up Ruby ${{ matrix.ruby }}
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install bundle
        env:
          PUPPET_GEM_VERSION: ${{ matrix.puppet }}
        run: |
          bundle config set --local without acceptance
          rm -f Gemfile.lock
          bundle install

      - name: Build and test
        env:
          SPEC_OPTS: "--format documentation"
        run: |
          bundle exec rake validate
          bundle exec rake lint
          bundle exec rake spec

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Check dependencies for known vulnerabilities
        run: bundle exec bundle-audit check --update

      - name: Check generated manifest is up to date
        run: |
          git clone --depth 1 https://github.com/puppetlabs/puppetlabs-firewall.git ../puppetlabs-firewall
          bash gen_params.sh > /tmp/init.pp
          diff -u manifests/init.pp /tmp/init.pp

  acceptance:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        name: Set up Ruby
        with:
          ruby-version: "3.2"

      - name: Install bundle
        env:
          PUPPET_GEM_VERSION: "~> 8.0"
        run: |
          rm -f Gemfile.lock
          bundle install

      - name: Run Litmus acceptance tests
        run: |
          bundle exec rake spec_prep
          bundle exec rake 'litmus:provision_list[default]'
          bundle exec rake 'litmus:install_agent[puppet8]'
          bundle exec rake litmus:install_module
          bundle exec rake litmus:acceptance:parallel

      - name: Tear down Litmus targets
        if: always()
        run: bundle exec rake litmus:tear_down
