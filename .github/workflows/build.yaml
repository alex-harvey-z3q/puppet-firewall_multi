name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - ruby: "2.7"
            puppet: "~> 7.0"
          - ruby: "3.2"
            puppet: "~> 8.0"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        name: Set up Ruby ${{ matrix.ruby }}
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install bundle
        env:
          PUPPET_GEM_VERSION: ${{ matrix.puppet }}
        run: |
          bundle config set --local without acceptance
          rm -f Gemfile.lock
          bundle install

      - name: Build and test
        env:
          SPEC_OPTS: "--format documentation"
        run: bundle exec rake ci:build

  acceptance:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        name: Set up Ruby
        with:
          ruby-version: "3.2"

      - name: Install bundle
        env:
          PUPPET_GEM_VERSION: "~> 8.0"
        run: |
          rm -f Gemfile.lock
          bundle install

      - name: Run Litmus acceptance tests
        run: bundle exec rake ci:acceptance

      - name: Tear down Litmus targets
        if: always()
        run: bundle exec rake ci:acceptance_teardown
