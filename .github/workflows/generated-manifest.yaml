name: Generated manifest

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check generated manifest is up to date
        run: |
          git clone --depth 1 https://github.com/puppetlabs/puppetlabs-firewall.git ../puppetlabs-firewall
          bash gen_params.sh > /tmp/init.pp
          diff -u manifests/init.pp /tmp/init.pp
